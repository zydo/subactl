name: scorecard
# OpenSSF Scorecard: how well the repository follows supply-chain security
# practices (branch protection, pinned dependencies, signed releases, ...).
# Results appear under Security > Code scanning and on scorecard.dev.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"   # Mondays
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-26.04
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish them to the public Scorecard API
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
