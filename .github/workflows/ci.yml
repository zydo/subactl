name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # F26 runs subactl from each of these shells; with the variable set, a
      # shell that is missing fails the test instead of being skipped.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - run: make lint
      - run: make test
        env:
          SUBACTL_REQUIRE_SHELLS: bash zsh fish
      - run: make build
      - run: make integration
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: brew install fish
      # Includes the macOS backend's tests, which start real processes.
      - run: make test
        env:
          SUBACTL_REQUIRE_SHELLS: bash zsh fish
      - run: make build
