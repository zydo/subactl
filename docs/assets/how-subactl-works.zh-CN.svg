<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif">
<title>subactl 如何工作</title><desc>lead 的 lease 里装着各个 worker 的 lease，每个都有内存硬限。超限的 worker 连同它启动的一切被终止；subactld 从不超卖内存，整组终止，保住整台机器。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafbff"/><stop offset="1" stop-color="#f1f4fb"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f8fafc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e8f0" stroke-width="3"/></pattern><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.07"/></filter><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="559" rx="22" fill="url(#bg)" stroke="#e2e8f0"/>
<text x="40" y="58" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-0.3">subactl 如何工作</text>
<rect x="40" y="84" width="572" height="440" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
<text x="62" y="114" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.6">一台机器</text>
<rect x="58" y="128" width="536" height="296" rx="16" fill="#f5f7ff" stroke="#c7d2fe"/>
<rect x="76" y="144" width="60" height="24" rx="12" fill="url(#brand)"/><text x="106.0" y="161" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">lead</text>
<text x="148" y="162" font-size="16" font-weight="700" fill="#312e81">9 GiB</text>
<rect x="76" y="180" width="164" height="232" rx="14" fill="#ffffff" stroke="#e0e7ff" filter="url(#soft)"/><text x="92" y="210" font-size="15" font-weight="700" fill="#0f172a">worker</text><rect x="170" y="193" width="56" height="24" rx="12" fill="#eef2ff"/><text x="198.0" y="210" font-size="13" font-weight="600" fill="#4338ca" text-anchor="middle">3 GiB</text><rect x="90" y="230" width="136" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/><circle cx="106" cy="245" r="4" fill="#10b981"/><text x="118" y="250" font-size="14" fill="#334155">node</text><rect x="90" y="268" width="136" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/><circle cx="106" cy="283" r="4" fill="#10b981"/><text x="118" y="288" font-size="14" fill="#334155">tsc</text><rect x="90" y="306" width="136" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/><circle cx="106" cy="321" r="4" fill="#10b981"/><text x="118" y="326" font-size="14" fill="#334155">dev server</text><rect x="90" y="360" width="136" height="38" rx="12" fill="#ecfdf5"/><text x="158" y="385" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">200 · 完成</text>
<rect x="250" y="180" width="164" height="232" rx="14" fill="#fff1f2" stroke="#fecdd3"/><text x="266" y="210" font-size="15" font-weight="700" fill="#0f172a">worker</text><rect x="344" y="193" width="56" height="24" rx="12" fill="#ffe4e6"/><text x="372.0" y="210" font-size="13" font-weight="600" fill="#be123c" text-anchor="middle">3 GiB</text><rect x="264" y="230" width="136" height="30" rx="15" fill="#ffffff" stroke="#fda4af" stroke-dasharray="4 3"/><circle cx="280" cy="245" r="4" fill="#fb7185"/><text x="292" y="250" font-size="14" fill="#be123c">node</text><rect x="264" y="268" width="136" height="30" rx="15" fill="#ffffff" stroke="#fda4af" stroke-dasharray="4 3"/><circle cx="280" cy="283" r="4" fill="#fb7185"/><text x="292" y="288" font-size="14" fill="#be123c">chrome ×11</text><rect x="264" y="306" width="136" height="30" rx="15" fill="#ffffff" stroke="#fda4af" stroke-dasharray="4 3"/><circle cx="280" cy="321" r="4" fill="#fb7185"/><text x="292" y="326" font-size="14" fill="#be123c">dev server</text><rect x="264" y="350" width="136" height="48" rx="12" fill="#ffe4e6"/><text x="332" y="371" font-size="15" font-weight="700" fill="#be123c" text-anchor="middle">413 · 超出上限</text><text x="332" y="389" font-size="12.5" fill="#be123c" text-anchor="middle">整组终止</text>
<rect x="424" y="180" width="164" height="232" rx="14" fill="#ffffff" stroke="#e0e7ff" filter="url(#soft)"/><text x="440" y="210" font-size="15" font-weight="700" fill="#0f172a">worker</text><rect x="518" y="193" width="56" height="24" rx="12" fill="#eef2ff"/><text x="546.0" y="210" font-size="13" font-weight="600" fill="#4338ca" text-anchor="middle">2.5 GiB</text><rect x="438" y="230" width="136" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/><circle cx="454" cy="245" r="4" fill="#6366f1"/><text x="466" y="250" font-size="14" fill="#334155">node</text><rect x="438" y="270" width="136" height="78" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-dasharray="5 4"/><text x="452" y="294" font-size="14" font-weight="700" fill="#3730a3">fixer</text><rect x="516" y="278" width="50" height="24" rx="12" fill="#ffffff"/><text x="541.0" y="295" font-size="12" font-weight="600" fill="#4338ca" text-anchor="middle">1 GiB</text><rect x="448" y="308" width="116" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/><circle cx="464" cy="323" r="4" fill="#6366f1"/><text x="476" y="328" font-size="14" fill="#334155">jest</text><rect x="438" y="360" width="136" height="38" rx="12" fill="#eef2ff"/><circle cx="470" cy="379" r="4.5" fill="#6366f1"/><text x="512" y="385" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">运行中</text>
<rect x="58" y="440" width="262" height="66" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<text x="189" y="479" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">其他程序</text>
<rect x="332" y="440" width="262" height="66" rx="14" fill="url(#hatch)" stroke="#e2e8f0"/>
<text x="463" y="479" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">预留线</text>
<path d="M598,206 C618,206 620,196 640,196" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#tip)"/>
<text x="620" y="186" font-size="12" font-weight="600" fill="#6366f1" text-anchor="middle">spawn</text>
<path d="M640,268 C620,268 618,278 598,278" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#tip)"/>
<text x="620" y="300" font-size="12" font-weight="600" fill="#6366f1" text-anchor="middle">事件</text>
<rect x="644" y="84" width="276" height="240" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
<rect x="664" y="104" width="40" height="40" rx="11" fill="url(#brand)"/>
<path d="M684,113 l10,4 v7 c0,6 -4.5,10 -10,12 c-5.5,-2 -10,-6 -10,-12 v-7 z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
<text x="716" y="122" font-size="19" font-weight="800" fill="#0f172a">subactld</text>
<text x="716" y="141" font-size="13" fill="#64748b">daemon</text>
<circle cx="678" cy="184" r="13" fill="#eef2ff"/><path d="M672.5,184.5 l3.8,3.8 l7.2,-7.6" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="190" font-size="16" font-weight="600" fill="#0f172a">绝不超卖</text>
<circle cx="678" cy="230" r="13" fill="#eef2ff"/><path d="M672.5,230.5 l3.8,3.8 l7.2,-7.6" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="236" font-size="16" font-weight="600" fill="#0f172a">整组终止</text>
<circle cx="678" cy="276" r="13" fill="#eef2ff"/><path d="M672.5,276.5 l3.8,3.8 l7.2,-7.6" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="282" font-size="16" font-weight="600" fill="#0f172a">保住机器</text>
<rect x="644" y="340" width="276" height="184" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
<text x="664" y="372" font-size="15" font-weight="700" fill="#0f172a">每个 lease 一个终止码</text>
<rect x="664" y="390" width="50" height="24" rx="12" fill="#ecfdf5"/><text x="689.0" y="407" font-size="13.5" font-weight="600" fill="#047857" text-anchor="middle">200</text>
<text x="726" y="407" font-size="15" fill="#334155">完成</text>
<rect x="664" y="422" width="50" height="24" rx="12" fill="#ffe4e6"/><text x="689.0" y="439" font-size="13.5" font-weight="600" fill="#be123c" text-anchor="middle">413</text>
<text x="726" y="439" font-size="15" fill="#334155">超出自身上限</text>
<rect x="664" y="454" width="50" height="24" rx="12" fill="#fef3c7"/><text x="689.0" y="471" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="middle">503</text>
<text x="726" y="471" font-size="15" fill="#334155">机器内存不足</text>
<rect x="664" y="486" width="50" height="24" rx="12" fill="#f1f5f9"/><text x="689.0" y="503" font-size="13.5" font-weight="600" fill="#475569" text-anchor="middle">502</text>
<text x="726" y="503" font-size="15" fill="#334155">父节点结束</text>
</svg>
